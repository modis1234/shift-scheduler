# Fly.io 배포 설정. 비밀 값은 여기 두지 않고 `fly secrets set`으로 넣는다(README '배포 (Fly.io)').
# app 이름은 `fly apps create` 때 정한 값으로 바꾼다.
app = "shift-scheduler"
primary_region = "nrt" # Supabase(ap-northeast-1)와 같은 도쿄

[build]
  dockerfile = "Dockerfile"

[env]
  STAFF_SHARE_BETA = "1"

[http_service]
  internal_port = 3000
  force_https = true
  # 개발용: 요청이 없으면 멈추고 접속하면 다시 켠다(켜진 시간만 과금).
  # 운영 전환 시 auto_stop_machines = "off", min_machines_running = 1 (리마인더 푸시는 상시 실행 필요)
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/login"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  # 엔진(OR-Tools)이 요청마다 python 프로세스를 띄우므로 1GB
  size = "shared-cpu-1x"
  memory = "1gb"
