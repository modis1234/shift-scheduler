<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>연결 안 됨 | 교대근무 스케줄러</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #12151b; --muted: #5b6270; --accent: #4f46e5; --accent-fg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12151b; --fg: #eef0f4; --muted: #a3a9b6; --accent: #8189f8; --accent-fg: #0a0c10; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
  p { color: var(--muted); }
  button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <h1>인터넷에 연결되지 않았습니다</h1>
    <p>연결한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
