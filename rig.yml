version: "0.2"
name: ai-scheduler-team
summary: 멀티 산업군 AI 스케줄러 개발 팀 (Claude Code & Codex 협업)
permission_policy: builtin:auto

pods:
  - id: dev
    label: AI Scheduler
    members:
      - id: lead
        label: Lead Architect
        agent_ref: "local:agents/lead-architect"
        runtime: codex
        profile: default
        cwd: "."
      - id: algo
        label: Algorithm Engineer
        agent_ref: "local:agents/algorithm-engineer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: developer
        label: Developer
        agent_ref: "local:agents/frontend-engineer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: plan
        label: Product Planner
        agent_ref: "local:agents/product-planner"
        runtime: codex
        profile: default
        cwd: "."
      - id: design
        label: UI/UX Designer
        agent_ref: "local:agents/ui-designer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: be
        label: Backend Engineer
        agent_ref: "local:agents/backend-engineer"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: qa
        label: QA Tester
        agent_ref: "local:agents/qa-tester"
        runtime: claude-code
        profile: default
        cwd: "."
      - id: review
        label: Code Reviewer
        agent_ref: "local:agents/code-reviewer"
        runtime: codex
        profile: default
        cwd: "."
      - id: deploy
        label: Deployer
        agent_ref: "local:agents/deployer"
        runtime: claude-code
        profile: default
        cwd: "."
    edges:
      - kind: delegates_to
        from: lead
        to: algo
      - kind: delegates_to
        from: lead
        to: review
      - kind: delegates_to
        from: algo
        to: review
      - kind: delegates_to
        from: lead
        to: developer
      - kind: delegates_to
        from: developer
        to: review
      - kind: delegates_to
        from: lead
        to: be
      - kind: delegates_to
        from: be
        to: review
      - kind: delegates_to
        from: lead
        to: qa
      - kind: delegates_to
        from: lead
        to: design
      - kind: delegates_to
        from: design
        to: developer
      - kind: delegates_to
        from: lead
        to: plan
      - kind: delegates_to
        from: lead
        to: deploy

edges: []
